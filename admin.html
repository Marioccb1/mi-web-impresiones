<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración — Impresos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background: #F5F5F5; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 40px auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h1, h2 { font-family: 'Montserrat', sans-serif; color: #1A2B4C; }
    #login-section { max-width: 400px; margin: 100px auto; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font: inherit; }
    button { width: 100%; padding: 14px; background: #FF6B00; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: background 0.3s; }
    button:hover { background: #E55F00; }
    button:disabled { opacity: 0.65; cursor: wait; }
    #admin-section[hidden], #login-section[hidden] { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 14px; text-align: left; border-bottom: 1px solid #eee; }
    th { background: #1A2B4C; color: white; font-family: 'Montserrat', sans-serif; }
    tr:hover { background: #f9f9f9; }
    .btn-logout { background: #333; width: auto; padding: 10px 20px; margin-bottom: 20px; font-size: 14px; }
    .error { color: #b83232; font-size: 14px; margin-top: 15px; }
    .back-link { display: inline-block; margin-top: 16px; color: #1A2B4C; }
    @media (max-width: 600px) {
      .container { margin: 20px auto; padding: 24px 18px; }
      #login-section { margin: 40px auto; }
      th, td { padding: 10px; }
    }
  </style>
</head>
<body>
  <main>
    <section id="login-section" class="container">
      <h1>Acceso al Panel</h1>
      <p>Ingresa tus credenciales para ver las cotizaciones.</p>
      <form id="login-form">
        <input type="email" id="email" placeholder="Correo electrónico" autocomplete="username" required>
        <input type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="submit">Iniciar sesión</button>
      </form>
      <p id="error-msg" class="error" role="alert" aria-live="polite"></p>
      <a class="back-link" href="index.html">Volver al sitio</a>
    </section>

    <section id="admin-section" class="container" hidden>
      <button id="logout-btn" class="btn-logout" type="button">Cerrar sesión</button>
      <h1>Cotizaciones recibidas</h1>
      <p>Aquí puedes ver los pedidos que han llegado desde tu página web.</p>
      <p id="table-message" role="status" aria-live="polite"></p>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Nombre</th>
              <th>Teléfono</th>
              <th>Correo</th>
              <th>Producto</th>
            </tr>
          </thead>
          <tbody id="tabla-cotizaciones"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://elqtbunqgmcmgyzmehxy.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVscXRidW5xZ21jbWd5em1laHh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMDk5MzUsImV4cCI6MjEwODY4NTkzNX0.gHb9d4km8i583nryISaIsvkYvQFnl7EioPcP_zrtZiQ';
    const db = window.supabase.createClient(supabaseUrl, supabaseKey);
    const loginSection = document.getElementById('login-section');
    const adminSection = document.getElementById('admin-section');
    const loginForm = document.getElementById('login-form');
    const errorMessage = document.getElementById('error-msg');
    const tableMessage = document.getElementById('table-message');
    const tableBody = document.getElementById('tabla-cotizaciones');

    const showPanel = (visible) => {
      loginSection.hidden = visible;
      adminSection.hidden = !visible;
    };

    const addCell = (row, value) => {
      const cell = document.createElement('td');
      cell.textContent = value == null || value === '' ? '-' : String(value);
      row.appendChild(cell);
    };

    async function mostrarPanel() {
      showPanel(true);
      tableBody.replaceChildren();
      tableMessage.textContent = 'Cargando cotizaciones…';

      const { data, error } = await db
        .from('cotizaciones')
        .select('created_at, nombre, telefono, correo, tipo_producto')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Error al cargar cotizaciones:', error);
        tableMessage.textContent = `Error al cargar los datos: ${error.message}`;
        return;
      }

      if (!data || data.length === 0) {
        tableMessage.textContent = 'Aún no hay cotizaciones.';
        return;
      }

      tableMessage.textContent = '';
      data.forEach((cotizacion) => {
        const row = document.createElement('tr');
        const fecha = cotizacion.created_at
          ? new Date(cotizacion.created_at).toLocaleString('es-ES', {
              day: '2-digit',
              month: 'short',
              year: 'numeric',
              hour: '2-digit',
              minute: '2-digit'
            })
          : '-';

        addCell(row, fecha);
        addCell(row, cotizacion.nombre);
        addCell(row, cotizacion.telefono);
        addCell(row, cotizacion.correo);
        addCell(row, cotizacion.tipo_producto);
        tableBody.appendChild(row);
      });
    }

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorMessage.textContent = '';
      const submitButton = loginForm.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'Iniciando sesión…';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const { error } = await db.auth.signInWithPassword({ email, password });

        if (error) {
          errorMessage.textContent = `No se pudo iniciar sesión: ${error.message}`;
          return;
        }

        loginForm.reset();
        await mostrarPanel();
      } catch (error) {
        console.error('Error durante el inicio de sesión:', error);
        errorMessage.textContent = 'Ocurrió un error de conexión. Inténtalo de nuevo.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'Iniciar sesión';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      const { error } = await db.auth.signOut();
      if (error) {
        console.error('Error al cerrar sesión:', error);
        tableMessage.textContent = `No se pudo cerrar sesión: ${error.message}`;
        return;
      }
      showPanel(false);
    });

    db.auth.getSession().then(({ data, error }) => {
      if (error) {
        console.error('Error al comprobar la sesión:', error);
        errorMessage.textContent = 'No se pudo comprobar la sesión. Recarga la página.';
        return;
      }
      if (data.session) {
        mostrarPanel();
      }
    }).catch((error) => {
      console.error('Error al comprobar la sesión:', error);
      errorMessage.textContent = 'No se pudo comprobar la sesión. Recarga la página.';
    });
  </script>
</body>
</html>
